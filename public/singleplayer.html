<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single Player · Age of Pixel</title><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/pages-plain.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></head><body>
<a class="page-back" href="dashboard.html">‹ Back</a><main class="page-shell"><h1 class="page-title">Single Player</h1><p class="page-subtitle">Prepare your kingdom for battle.</p>
<form id="battleSetup" class="page-form">
<section class="page-section setup-grid">
<label>Battlefield<select id="mapSelect"><option value="riverwatch">Riverwatch Valley</option><option value="emberfall">Emberfall Pass</option><option value="frosthollow">Frosthollow Reach</option><option value="sunscar">Sunscar Desert</option><option value="verdant">Verdant Isles</option><option value="blackwood">Blackwood</option><option value="goldenplains">Golden Plains</option><option value="shatteredcoast">Shattered Coast</option><option value="moonfen">Moonfen Marsh</option><option value="ironridge">Ironridge</option><option value="random">Random Map</option><option value="infinite">Infinite Campaign</option></select></label>
<label>Map size<select id="sizeSelect"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option><option value="extreme">Extreme</option><option value="biggest">Biggest</option><option value="infinite">Infinite</option></select></label>
<label>Visibility<select id="visibilitySelect"><option value="fog">Fog</option><option value="reveal">Reveal</option><option value="explore" selected>Explore</option></select></label>
<label>Starting units<select id="unitsSelect"><option value="minimal">Minimal</option><option value="few" selected>Few</option><option value="many">Many</option></select></label>
<label>Towns<select id="townsSelect"><option value="few">Few</option><option value="normal" selected>Normal</option><option value="many">Many</option></select></label>
<label>Players<select id="playerCountSelect"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
</section><section class="page-section"><h2>Players</h2><div id="playerRoster" class="roster"></div></section><button class="primary-action" type="submit">Begin Battle</button></form></main>
<div class="rotate-guard"><div><span>↻</span><b>Rotate your device</b><p>Age of Pixel uses landscape mode.</p></div></div><script src="assets/js/app.js"></script><script src="assets/js/singleplayer.js"></script></body></html>
