<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Editor · Age of Pixel</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<header><div><b>Age of Pixel</b><span>Admin Editor</span></div><a href="dashboard.html">Main Menu</a></header>
<main>
  <nav class="admin-tabs"><button class="active" data-view="units">Troops &amp; Units</button><button data-view="maps">Map Builder</button></nav>
  <section id="unitsView" class="admin-view">
    <div class="editor-card">
      <h1>Add or Edit Troop</h1>
      <form id="unitForm">
        <input type="hidden" id="unitId">
        <label>Name<input id="unitName" required maxlength="30" placeholder="Giant"></label>
        <label>Type<select id="unitKind"><option>Infantry</option><option>Ranged troop</option><option>Cavalry</option><option>Siege</option><option>Civilian</option></select></label>
        <div class="number-grid">
          <label>Health<input id="unitHp" type="number" min="1" max="999" value="20" required></label>
          <label>Attack<input id="unitAttack" type="number" min="0" max="999" value="6" required></label>
          <label>Move<input id="unitMove" type="number" min="1" max="20" value="2" required></label>
          <label>Range<input id="unitRange" type="number" min="1" max="20" value="1" required></label>
          <label>Gold cost<input id="unitCost" type="number" min="0" max="9999" value="80" required></label>
        </div>
        <label>Description<textarea id="unitDescription" maxlength="160" placeholder="Heavy frontline unit."></textarea></label>
        <label>PNG icon (optional)<input id="unitIcon" type="file" accept="image/png"></label>
        <p class="file-note" id="unitFileNote">Without a PNG, the system creates a generated filename such as <b>giant.gif</b>.</p>
        <div class="form-actions"><button type="button" class="secondary" id="cancelUnitEdit" hidden>Cancel Edit</button><button type="submit">Save Troop</button></div>
      </form>
    </div>
    <div class="list-card"><h2>Custom Troops</h2><div id="unitList" class="item-list"></div></div>
  </section>
  <section id="mapsView" class="admin-view" hidden>
    <div class="editor-card map-editor-card">
      <h1>Map Builder</h1>
      <form id="mapForm">
        <input type="hidden" id="mapId">
        <label>Map name<input id="mapName" required maxlength="36" placeholder="Dragon Coast"></label>
        <div class="terrain-palette" id="terrainPalette" aria-label="Terrain tools">
          <button type="button" class="active" data-terrain="grass"><span>▧</span>Grass</button>
          <button type="button" data-terrain="water"><span>≈</span>Water</button>
          <button type="button" data-terrain="forest"><span>♣</span>Trees</button>
          <button type="button" data-terrain="hill"><span>▲</span>Hill</button>
          <button type="button" data-terrain="road"><span>═</span>Road</button>
        </div>
        <p class="file-note">Choose a terrain icon, then tap cells to paint the 12×9 base map. Match size can still scale it from Small to Biggest.</p>
        <div id="mapCanvas" class="map-canvas" role="grid" aria-label="Map terrain editor"></div>
        <div class="form-actions"><button type="button" class="secondary" id="clearMap">Clear</button><button type="button" class="secondary" id="cancelMapEdit" hidden>Cancel Edit</button><button type="submit">Save Map</button></div>
      </form>
    </div>
    <div class="list-card"><h2>Custom Maps</h2><div id="mapList" class="item-list"></div></div>
  </section>
</main>
<script src="assets/js/app.js"></script><script src="assets/js/admin.js"></script>
</body></html>
