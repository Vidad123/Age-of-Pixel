name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build-android-apk.yml']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APK
        run: gradle assembleDebug
      - name: Give APK a friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Age-of-Pixel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Age-of-Pixel-Android
          path: android-app/app/build/outputs/apk/debug/Age-of-Pixel.apk
